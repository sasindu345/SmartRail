station.ST05.name=Veyangoda

# One exclusive block between each pair of stations, each direction its own section.
# Northbound (Fort toward Veyangoda): SEC_A, SEC_B, SEC_E, SEC_G
# Southbound (Veyangoda toward Fort): SEC_H, SEC_F, SEC_C, SEC_D
sections=SEC_A,SEC_B,SEC_E,SEC_G,SEC_H,SEC_F,SEC_C,SEC_D
section.SEC_A.from=ST01
section.SEC_A.to=ST02
section.SEC_B.from=ST02
section.SEC_B.to=ST03
section.SEC_E.from=ST03
section.SEC_E.to=ST04
section.SEC_G.from=ST04
section.SEC_G.to=ST05
section.SEC_H.from=ST05
section.SEC_H.to=ST04
section.SEC_F.from=ST04
section.SEC_F.to=ST03
section.SEC_C.from=ST03
section.SEC_C.to=ST02
section.SEC_D.from=ST02
section.SEC_D.to=ST01

# Predefined routes = ordered list of sections, one block at a time
routes=R01,R02,R03,R04
route.R01.sections=SEC_A,SEC_B
route.R02.sections=SEC_H,SEC_F,SEC_C,SEC_D
# R03 shares SEC_A/SEC_B with R01 -> reservation conflict, then continues north
route.R03.sections=SEC_A,SEC_B,SEC_E,SEC_G
route.R04.sections=SEC_F,SEC_C,SEC_D

trains=TR01,TR02,TR03,TR04
train.TR01.name=Northbound Express
