# =====================================================================
# SmartRail railway model - FICTIONAL, simplified, educational only.
# Loaded by com.smartrail.common.config.RailwayData.
# Add/rename trains, stations, sections or routes here, never in code.
# =====================================================================

stations=ST01,ST02,ST03
station.ST01.name=Colombo Fort
station.ST02.name=Maradana
station.ST03.name=Ragama

# Exclusive track sections (each is FREE, RESERVED or OCCUPIED at runtime)
sections=SEC_A,SEC_B,SEC_C,SEC_D
section.SEC_A.from=ST01
section.SEC_A.to=ST02
section.SEC_B.from=ST02
section.SEC_B.to=ST03
section.SEC_C.from=ST03
section.SEC_C.to=ST02
section.SEC_D.from=ST02
section.SEC_D.to=ST01

# Predefined routes = ordered list of sections
routes=R01,R02,R03
route.R01.sections=SEC_A,SEC_B
route.R02.sections=SEC_C,SEC_D
# R03 shares SEC_A/SEC_B with R01 -> used to demonstrate a reservation conflict
route.R03.sections=SEC_A,SEC_B

trains=TR01,TR02,TR03
train.TR01.name=Northbound Express
train.TR01.start=ST01
train.TR01.route=R01
train.TR02.name=Southbound Commuter
train.TR02.start=ST03
train.TR02.route=R02
train.TR03.name=Northbound Local
train.TR03.start=ST01
train.TR03.route=R03

# Timetable: stationId@HH:mm, in stop order
schedule.TR01=ST01@08:00,ST02@08:12,ST03@08:30
schedule.TR02=ST03@08:05,ST02@08:22,ST01@08:35
schedule.TR03=ST01@08:10,ST02@08:24,ST03@08:45
