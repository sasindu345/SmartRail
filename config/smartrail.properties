# =====================================================================
# SmartRail network configuration (educational simulation only)
#
# Every port, host, timeout and path lives here - never in Java code.
# Read through com.smartrail.common.config.NetworkConfig using the key
# constants in ConfigKeys. Any key can be overridden on the command
# line with -Dkey=value (e.g. -Dnio.tcp.port=6000).
#
# Passwords are NEVER stored here: a "*.password.env" key holds the NAME
# of an environment variable that contains the secret.
# =====================================================================

# ---------- Shared ----------
protocol.service.name=SMARTRAIL
protocol.version=1
protocol.max.message.bytes=1024
railway.data.path=config/railway-data.properties
log.capacity=500

# ---------- Central server ----------
server.bind.address=0.0.0.0
# Host/IP the server advertises (UDP discovery reply, RMI). Empty = detect a site-local IPv4/IPv6 address.
server.advertised.host=
ui.server.window.enabled=true
ui.train.window.enabled=true

# ---------- Client side (train client + controller dashboard) ----------
client.server.host=localhost
# PLAIN = Member 1 NIO channel, TLS = Member 4 secure channel
client.transport=PLAIN
client.default.train.id=TR01
client.connect.timeout.ms=3000
client.reconnect.attempts=3
client.reconnect.delay.ms=2000
client.simulator.step.ms=2000

# ---------- Member 1 : Java NIO TCP train-control channel ----------
nio.tcp.enabled=true
nio.tcp.port=5000
nio.selector.timeout.ms=1000

# ---------- Member 3 : UDP discovery / multicast alerts / heartbeat ----------
udp.discovery.enabled=true
udp.discovery.port=5001
udp.discovery.broadcast.address=255.255.255.255
udp.discovery.timeout.ms=3000
multicast.enabled=true
multicast.group=230.0.0.1
multicast.port=5002
multicast.ttl=1
# Interface name for multicast (e.g. en0, eth0, wlan0). Empty = let the OS choose.
multicast.interface=
# Send alerts also by unicast to each connected train IP (for Wi-Fi networks that block multicast)
multicast.unicast.fallback.enabled=false
heartbeat.enabled=true
heartbeat.interval.ms=3000
heartbeat.timeout.ms=10000

# ---------- Member 4 : TLS secure channel + URL/URLConnection resources ----------
tls.enabled=true
tls.port=5443
tls.protocols=TLSv1.3,TLSv1.2
tls.keystore.type=PKCS12
tls.keystore.path=certs/server-keystore.p12
tls.keystore.password.env=SMARTRAIL_KEYSTORE_PASSWORD
tls.truststore.path=certs/client-truststore.p12
tls.truststore.password.env=SMARTRAIL_TRUSTSTORE_PASSWORD
http.resource.enabled=true
http.resource.port=8080
http.resource.base.path=/api
http.client.connect.timeout.ms=3000
http.client.read.timeout.ms=3000

# ---------- Member 5 : RMI administration + smartrail:// handlers ----------
rmi.enabled=true
rmi.registry.port=1099
rmi.service.port=1100
rmi.service.name=RailwayAdmin
smartrail.resource.enabled=true
smartrail.resource.port=5100
smartrail.resource.timeout.ms=3000
